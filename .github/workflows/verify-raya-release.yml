name: Verify deployed Kazakh voice
on:
  push:
    branches: [raya-kazakh-voice]
    paths: ['.github/workflows/verify-raya-release.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ef4656288698c42a98db34ae1c19848ccca3bf
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Decode production recordings and run the deployed model twice
        run: |
          sed 's#await page.goto("http://127.0.0.1:" + server.address().port);#await page.goto("https://aidos.nexcel.kz");#' scripts/check-kazakh-voice.mjs > scripts/.live-raya.mjs
          node scripts/.live-raya.mjs
      - name: Play the greeting through the live Kazakh welcome screen
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const pack = JSON.parse(await readFile('public/audio/kk/manifest.json'));
          const dict = (await import('./src/i18n/kk.ts')).default;
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.addInitScript(() => {
              localStorage.setItem('mypal.lang','kk');
              localStorage.setItem('mission-control.sound','on');
              window.starts = [];
              const start = AudioBufferSourceNode.prototype.start;
              AudioBufferSourceNode.prototype.start = function (...args) {
                if (this.buffer?.duration > .15 && !this.loop) window.starts.push(this.buffer.duration);
                return start.apply(this, args);
              };
            });
            await page.goto('https://aidos.nexcel.kz');
            const ready = page.waitForResponse(r => new URL(r.url()).pathname === pack.clips.common_setup_greeting && r.ok());
            await page.getByRole('button',{name:dict['welcome.continue'],exact:true}).click();
            await ready;
            await page.waitForFunction(() => window.starts.length > 0);
            const durations = await page.evaluate(() => window.starts);
            assert(durations[0] > .15);
            console.log('Live welcome played Raya', pack.clips.common_setup_greeting, durations, 'seconds');
          } finally { await browser.close(); }
          JS
      - name: Export verified release for offline checkout
        run: |
          git branch verified-raya-release HEAD
          git bundle create "$RUNNER_TEMP/aidos-raya.bundle" verified-raya-release ^f5cf731
      - uses: actions/upload-artifact@v4
        with:
          name: verified-raya-release
          path: ${{ runner.temp }}/aidos-raya.bundle
          retention-days: 1
